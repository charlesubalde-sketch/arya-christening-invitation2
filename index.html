<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Will You Be My Ninong/Ninang? — Arya</title>
<style>
:root{--ivory:#fcfbf7;--ink:#3f3a3d;--muted:#7d7479;--lilac:#a995b8;--lilac-soft:#eee8f2;--sage:#aebcad;--line:#e8e2e7;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:#f3f0f3;color:var(--ink);font-family:Georgia,"Times New Roman",serif;overflow-x:hidden}
.app{min-height:100vh;background:linear-gradient(145deg,#fcfbf7 0%,#faf8fb 55%,#f2eef5 100%);padding:22px;position:relative;overflow:hidden}
.toolbar{max-width:980px;margin:auto;background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:16px;padding:13px 17px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 8px 28px rgba(70,55,70,.07);backdrop-filter:blur(8px);position:relative;z-index:20}.toolbar button{border:0;border-radius:999px;padding:10px 16px;background:var(--lilac);color:#fff;font-weight:700;cursor:pointer}.toolbar .secondary{background:var(--lilac-soft);color:var(--ink)}
.layout{max-width:980px;margin:20px auto;display:grid;grid-template-columns:1fr 1.35fr;gap:20px;position:relative;z-index:10}.panel,.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:22px;box-shadow:0 15px 50px rgba(70,55,70,.08)}.panel{padding:22px}.panel h2{margin-top:0}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px 12px;border:1px solid #ddd5df;border-radius:11px;font:inherit;color:var(--ink);background:#fff}.field textarea{min-height:110px;resize:vertical}.hint{font-size:12px;color:var(--muted)}
.card{min-height:680px;padding:50px 38px;text-align:center;position:relative;overflow:hidden;background:var(--ivory)}.card:before{content:"";position:absolute;inset:0;opacity:.13;background:radial-gradient(ellipse at 18% 18%,#b9a0ca 0 8%,transparent 9%),radial-gradient(ellipse at 84% 72%,#aebcad 0 7%,transparent 8%);pointer-events:none}
.photo{display:block;max-width:180px;max-height:180px;margin:0 auto 15px;border-radius:50%;object-fit:cover;border:1px solid #e2d9e5;box-shadow:0 8px 25px rgba(80,65,85,.08)}.photo[src=""]{display:none}
.butterfly{width:82px;height:72px;margin:0 auto 9px;position:relative}.butterfly:before,.butterfly:after{content:"";position:absolute;top:8px;width:35px;height:47px;border:1.5px solid #b6a3c1;border-radius:70% 35% 65% 40%;background:linear-gradient(145deg,#f1ebf5,#ddd2e6)}.butterfly:before{left:3px;transform:rotate(-23deg)}.butterfly:after{right:3px;transform:rotate(23deg)}.butterfly span:before,.butterfly span:after{content:"";position:absolute;bottom:5px;width:27px;height:31px;border:1.5px solid #b6a3c1;border-radius:35% 70% 40% 65%;background:#eee8f2}.butterfly span:before{left:10px;transform:rotate(17deg)}.butterfly span:after{right:10px;transform:rotate(-17deg)}.butterfly span{position:absolute;left:39px;top:17px;width:5px;height:43px;border-radius:99px;background:#6e6670;z-index:2}
.eyebrow{letter-spacing:3px;text-transform:uppercase;font-size:11px;color:#8b7b92;font-weight:700}.name{font-size:54px;margin:5px 0;color:#5f5562}.subtitle{font-size:18px;margin-bottom:24px;color:#776c75}.divider{color:#a995b8;font-size:18px;margin:18px}.message{font-size:17px;line-height:1.8;white-space:pre-line;max-width:620px;margin:auto;color:#504a4f}.question{font-size:29px;color:#675b6b;margin:25px 0 18px;font-weight:700}.answer{display:inline-block;padding:13px 24px;background:#8f7b9d;color:#fff;border-radius:999px;font-weight:700;text-decoration:none;box-shadow:0 7px 18px rgba(110,90,125,.18);cursor:pointer;border:0;font-family:inherit;font-size:15px}
.details{margin-top:30px;padding-top:20px;border-top:1px solid var(--line);font-size:14px;line-height:1.7;color:#6f666d}.layout{display:block;max-width:980px;margin:20px auto;position:relative;z-index:10}
/* Flying butterflies */
.fliers{position:absolute;inset:0;pointer-events:none;z-index:2;overflow:hidden}.fly{position:absolute;width:74px;height:62px;opacity:.72;animation:flyAcross var(--dur) ease-in-out var(--delay) infinite;filter:drop-shadow(0 7px 9px rgba(80,55,95,.13))}.fly i,.fly b{position:absolute;display:block;width:34px;height:48px;top:5px;border-radius:78% 30% 72% 42%;border:1px solid rgba(116,86,132,.28);background:radial-gradient(circle at 68% 30%,rgba(255,255,255,.78) 0 4%,transparent 5%),radial-gradient(circle at 35% 66%,rgba(255,255,255,.52) 0 5%,transparent 6%),linear-gradient(145deg,#d9c3e4 0%,#aa88bd 48%,#775b83 100%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.15),inset 8px -5px 12px rgba(73,49,83,.18)}.fly i:after,.fly b:after{content:"";position:absolute;inset:7px 8px;border-left:1px solid rgba(255,255,255,.35);border-radius:50%;transform:rotate(20deg)}.fly i{left:1px;transform:rotate(-22deg);transform-origin:92% 82%;animation:wing .48s ease-in-out infinite alternate}.fly b{right:1px;transform:rotate(22deg);transform-origin:8% 82%;animation:wing .48s ease-in-out infinite alternate-reverse}.fly:after{content:"";position:absolute;width:6px;height:43px;background:linear-gradient(#3e3541,#6e626f);border-radius:8px;left:34px;top:10px;z-index:3}.fly:nth-child(1){top:12%;left:-90px;--dur:20s;--delay:-3s;transform:scale(.75)}.fly:nth-child(2){top:27%;left:-90px;--dur:25s;--delay:-16s;transform:scale(1.1)}.fly:nth-child(3){top:58%;left:-90px;--dur:22s;--delay:-7s;transform:scale(.68)}.fly:nth-child(4){top:73%;left:-90px;--dur:29s;--delay:-21s;transform:scale(.88)}.fly:nth-child(5){top:42%;left:-90px;--dur:27s;--delay:-13s;transform:scale(.58)}@keyframes flyAcross{0%{translate:-12vw 16vh;rotate:-12deg}18%{translate:15vw -7vh;rotate:10deg}38%{translate:36vw 10vh;rotate:-5deg}58%{translate:60vw -8vh;rotate:9deg}78%{translate:82vw 7vh;rotate:-9deg}100%{translate:118vw -3vh;rotate:6deg}}@keyframes wing{from{scale:1 1}to{scale:.34 1}}
/* Confirmation */
.confirm{position:fixed;inset:0;background:radial-gradient(circle at center,#fff 0%,#faf7fc 52%,#eee7f2 100%);z-index:100;display:none;align-items:center;justify-content:center;text-align:center;padding:25px;overflow:hidden}.confirm.show{display:flex}.confirm-content{position:relative;z-index:5;max-width:700px}.confirm-eyebrow{letter-spacing:4px;text-transform:uppercase;color:#8b7b92;font-size:11px;font-weight:bold}.confirm h1{font-size:48px;color:#5f5562;margin:10px 0}.confirm p{font-size:19px;line-height:1.7;color:#625a61;margin:0 auto 25px;max-width:580px}.confirm-butterfly{width:120px;height:100px;margin:0 auto 15px;position:relative}.confirm-butterfly .wing{position:absolute;width:53px;height:70px;top:12px;border:2px solid #a995b8;background:linear-gradient(135deg,#f3edf6,#cdbbd8);box-shadow:0 0 22px rgba(169,149,184,.25);border-radius:80% 35% 70% 40%}.confirm-butterfly .left{left:4px;transform:rotate(-18deg)}.confirm-butterfly .right{right:4px;transform:rotate(18deg)}.confirm-butterfly .body{position:absolute;left:57px;top:18px;width:7px;height:66px;border-radius:10px;background:#655d66;z-index:2}.confirm-butterfly .antenna{position:absolute;width:35px;height:20px;border-top:2px solid #655d66;border-radius:50%;top:5px}.confirm-butterfly .a1{left:32px;transform:rotate(-25deg)}.confirm-butterfly .a2{right:32px;transform:scaleX(-1) rotate(-25deg)}
.burst{position:absolute;inset:0;pointer-events:none}.spark{position:absolute;left:50%;top:46%;width:5px;height:5px;border-radius:50%;background:#b8a0c7;animation:burst 1.7s ease-out forwards;opacity:0}.spark:nth-child(odd){background:#b4c1ae}.spark:nth-child(3n){background:#d6a9bc}.spark:nth-child(4n){background:#e2c98d}@keyframes burst{0%{opacity:0;transform:rotate(var(--a)) translateX(0) scale(.3)}12%{opacity:1}100%{opacity:0;transform:rotate(var(--a)) translateX(var(--d)) scale(.8)}}
.confirm button{border:0;border-radius:999px;padding:12px 20px;background:#8f7b9d;color:#fff;font-weight:700;cursor:pointer}
@media(max-width:820px){.layout{grid-template-columns:1fr}.card{min-height:auto;padding:44px 25px}.toolbar{flex-wrap:wrap}.name{font-size:44px}.confirm h1{font-size:38px}}
</style></head>
<body><div class="app">
<div class="fliers" aria-hidden="true"><span class="fly"><i></i><b></b></span><span class="fly"><i></i><b></b></span><span class="fly"><i></i><b></b></span><span class="fly"><i></i><b></b></span><span class="fly"><i></i><b></b></span></div>
<div class="layout">
<section class="card"><img id="photoPreview" class="photo" alt="Arya photo"><div class="butterfly" aria-hidden="true"><span></span></div><div class="eyebrow">A special question from</div><div class="name" id="outName"></div><div class="subtitle" id="outSubtitle"></div><div class="divider">· · ·</div><div class="message" id="outMessage"></div><div class="question" id="outQuestion"></div><button id="outButton" class="answer">YES, I’D LOVE TO! 💕</button><div class="details" id="outDetails"></div></section>
</div></div>
<div id="confirm" class="confirm"><div class="burst" id="burst"></div><div class="confirm-content"><div class="confirm-butterfly" aria-hidden="true"><span class="wing left"></span><span class="wing right"></span><span class="body"></span><span class="antenna a1"></span><span class="antenna a2"></span></div><div class="confirm-eyebrow">Arya is so happy! ✦</div><h1>Thank you! 💕</h1><p id="thankYouText">Thank you for saying yes! You are now officially one of my very special godparents. I can't wait to have you by my side as I grow up!</p><button onclick="closeConfirm()">Back to invitation</button></div></div>
<script>
function showConfirm(){document.getElementById('thankYouText').textContent='Thank you for saying yes! You are now officially one of Arya’s very special godparents. I can’t wait to have you by my side as I grow up!';const b=document.getElementById('burst');b.innerHTML='';for(let i=0;i<90;i++){let s=document.createElement('span');s.className='spark';s.style.setProperty('--a',(i*4)+'deg');s.style.setProperty('--d',(100+Math.random()*340)+'px');s.style.animationDelay=(Math.random()*.55)+'s';b.appendChild(s)}document.getElementById('confirm').classList.add('show')}
function closeConfirm(){document.getElementById('confirm').classList.remove('show')}
document.getElementById('outButton').addEventListener('click',e=>{e.preventDefault();showConfirm()});
</script></body></html>
